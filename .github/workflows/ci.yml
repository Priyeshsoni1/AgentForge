name: AgentForge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups --extra dev

      - name: Check Python syntax
        run: uv run python -m compileall -q src tests evals

      - name: Run tests with coverage
        run: uv run pytest --cov=agentforge --cov-report=term-missing --cov-report=xml

      - name: Build Docker image
        run: docker build -t agentforge:ci .
